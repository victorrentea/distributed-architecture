# protect the server: /limited accepts at most 3000 calls in every 10-second window
resilience4j.ratelimiter.instances.limited.limit-for-period=3000
resilience4j.ratelimiter.instances.limited.limit-refresh-period=10s
# a call over the limit is refused at once (429), instead of waiting in line for the next window
resilience4j.ratelimiter.instances.limited.timeout-duration=0

# /single runs at most 1 call at a time; a concurrent call is refused at once (429), instead of waiting for the first to finish
resilience4j.bulkhead.instances.single.max-concurrent-calls=1
resilience4j.bulkhead.instances.single.max-wait-duration=0
