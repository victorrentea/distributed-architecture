# protect the server: /limited accepts at most 3 calls in every 10-second window
resilience4j.ratelimiter.instances.limited.limit-for-period=3
resilience4j.ratelimiter.instances.limited.limit-refresh-period=10s
# a call over the limit is refused at once (429), instead of waiting in line for the next window
resilience4j.ratelimiter.instances.limited.timeout-duration=0
