# applies to every RestClient built from the RestClient.Builder that Spring Boot auto-configures
spring.http.client.connect-timeout=1s
spring.http.client.read-timeout=10s

# up to 3 attempts in total, half a second apart
resilience4j.retry.instances.flaky.max-attempts=3
resilience4j.retry.instances.flaky.wait-duration=500ms
