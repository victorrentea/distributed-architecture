# applies to every RestClient built from the RestClient.Builder that Spring Boot auto-configures
spring.http.client.connect-timeout=1s
spring.http.client.read-timeout=10s

# up to 3 attempts in total
resilience4j.retry.instances.flaky.max-attempts=3
# exponential backoff: wait 500ms, then 1s, then 2s... - give a struggling server time to recover
resilience4j.retry.instances.flaky.wait-duration=500ms
resilience4j.retry.instances.flaky.enable-exponential-backoff=true
resilience4j.retry.instances.flaky.exponential-backoff-multiplier=2
# jitter: each wait is randomized by +-50%, so clients that failed together don't all come back together
resilience4j.retry.instances.flaky.enable-randomized-wait=true
resilience4j.retry.instances.flaky.randomized-wait-factor=0.5
